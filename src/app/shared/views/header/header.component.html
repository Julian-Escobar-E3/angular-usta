<header id="header" class="fixed-top">
  <nav
    class="navbar navbar-expand-lg bg-body-tertiary border-bottom border-body"
    style="height: 100px"
    data-bs-theme="dark"
  >
    <div class="container-fluid">
      <a class="navbar-brand" [routerLink]="['/']">Egresados USTA</a>
      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#navbarSupportedContent"
        aria-controls="navbarSupportedContent"
        aria-expanded="false"
        aria-label="Toggle navigation"
      >
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a
              class="nav-link"
              [routerLink]="['news-list']"
              routerLinkActive="active"
              >Noticias</a
            >
          </li>
          <li class="nav-item">
            <a
              class="nav-link"
              [routerLink]="['events-list']"
              routerLinkActive="active"
              >Eventos</a
            >
          </li>
        </ul>
        <a class="btn btnusta" [routerLink]="['login']">Iniciar Sesión</a>
      </div>
    </div>
  </nav>
</header>
