<header id="header" class="header fixed-top d-flex align-items-center">
  <div class="d-flex align-items-center justify-content-between">
    <div class="logo d-flex justify-content-start align-items-sm-center">
      <img src="assets/logo2.png" alt="" />
    </div>
    <i class="bi bi-list toggle-sidebar-btn"></i>
  </div>
  <!-- End Logo -->
  <nav class="header-nav ms-auto">
    <ul class="d-flex align-items-center">

      <li class="nav-item dropdown pe-3">
        <div
          class="nav-link nav-profile d-flex align-items-center pe-0 clickable-div"
          data-bs-toggle="dropdown"
        >
          <span class="d-none d-md-block dropdown-toggle"
            >{{"admin@admin"}}</span
          >
        </div>
        <!-- End Profile Iamge Icon -->

        <ul class="dropdown-menu dropdown-menu-end dropdown-menu-arrow">
          <li>
            <a class="dropdown-item d-flex align-items-center" href="#">
              <i class="bi bi-box-arrow-right"></i>
              <span>Cerrar Sesión</span>
            </a>
          </li>
        </ul>
        <!-- End Profile Dropdown Items -->
      </li>
      <!-- End Profile Nav -->
    </ul>
  </nav>
  <!-- End Icons Navigation -->
</header>

<!-- ======= Sidebar ======= -->
<aside id="sidebar" class="sidebar">
  <ul class="sidebar-nav" id="sidebar-nav">
    <li class="nav-heading">Pages</li>

    @for (option of sidebarOptions; track $index) {

    <li class="nav-item">
      <a
        class="nav-link collapsed"
        [attr.data-bs-target]="'#' + option.id"
        data-bs-toggle="collapse"
      >
        <i [class]="option.icon"></i><span>{{ option.name }}</span>
        @if (option.childrens!.length !== 0) {
        <i class="bi bi-chevron-down ms-auto"></i>
        }
      </a>
      <ul
        [id]="option.id"
        class="nav-content collapse"
        data-bs-parent="#sidebar-nav"
      >
        @for (hijo of option.childrens ; track $index) {
        <li>
          <a [routerLink]="[hijo.path]">
            <i
              [class]="
                routeIsActive(hijo.path) ? 'bi bi-circle-fill' : hijo.icon
              "
            ></i>
            <span>{{ hijo.name }}</span>
          </a>
        </li>
        }
      </ul>
    </li>
    }
  </ul>
</aside>
<!-- End Sidebar-->
