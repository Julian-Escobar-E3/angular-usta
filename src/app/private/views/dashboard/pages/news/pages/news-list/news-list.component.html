<main id="main" class="main">
  <app-title title="noticias" section="administrar noticias"></app-title>

  <section class="section dashboard">
    <div class="row">
      <div class="card">
        <div class="card-body">
          <div class="card-title d-flex justify-content-center mb-3 mt-2">
            <input
              type="text"
              [ngModel]="searchValue()"
              (ngModelChange)="searchInput = $event"
              placeholder="Buscar por título..."
              class="form-control"
            />
            <button (click)="onSearch()" class="btn btn-primary">Buscar</button>
          </div>

          <!-- fixed -->

          <table class="table table-hover border border-3">
            <thead class="table-primary">
              <tr>
                @for (column of columns; track $index) {
                <th class="text-center" style="width: auto">
                  {{ column | titlecase }}
                </th>

                }
                <th>Opciones</th>
              </tr>
            </thead>
            <tbody>
              @for (news of newsList(); track $index) {
              <tr>
                @for (row of rows; track $index) {
                <td class="text-center mt-4" style="width: auto">
                  {{ news[row] }}
                </td>

                }

                <td>
                  <img [srcset]="[news.images?.sm]" [alt]="[news.title]" />
                </td>
                <td>
                  <a [routerLink]="['../details-news/', news.id_news]">
                    <i class="bi bi-pencil"></i>
                  </a>
                </td>
              </tr>
              } @empty {
              <div class="d-flex justify-content-center mt-2">
                No hay información que mostrar
              </div>
              }
            </tbody>
          </table>

          <!-- fixed -->
        </div>
        <!-- Paginación -->
        <nav class="mt-4" aria-label="Paginación de noticias">
          <ul class="pagination justify-content-center">
            <!-- Botón Anterior -->
            <li class="page-item" [class.disabled]="currentPage() === 1">
              <button
                class="page-link"
                (click)="previousPage()"
                [disabled]="currentPage() === 1"
                aria-label="Página anterior"
              >
                Anterior
              </button>
            </li>

            <!-- Páginas dinámicas -->
            @for (page of visiblePages(); track page) {
            <li class="page-item" [class.active]="page === currentPage()">
              <button
                class="page-link"
                (click)="goToPage(page)"
                aria-label="Página anterior"
              >
                {{ page }}
              </button>
            </li>
            }

            <!-- Botón Siguiente -->
            <li
              class="page-item"
              [class.disabled]="currentPage() === totalPages()"
            >
              <button
                class="page-link"
                (click)="nextPage()"
                [disabled]="currentPage() === totalPages()"
                aria-label="Página siguiente"
              >
                Siguiente
              </button>
            </li>
          </ul>
        </nav>
      </div>
    </div>
  </section>
</main>
