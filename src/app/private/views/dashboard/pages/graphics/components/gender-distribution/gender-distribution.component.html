<main id="main">
  <app-title
    title="reportes"
    section="graficas"
    icon="bi bi-grid-1x2"
    [subSection]="'ditribución por genero'"
  ></app-title>

  <section class="section">
    @if (graphicsService.graphicsLoading()) { <app-spinner /> }@else {
    <pie-chart
      [keysArray]="keysArray()!"
      [valuesArray]="valuesArray()!"
      [title]="'situación laboral de egresados'"
      [colors]="colors"
    />}
  </section>
</main>
