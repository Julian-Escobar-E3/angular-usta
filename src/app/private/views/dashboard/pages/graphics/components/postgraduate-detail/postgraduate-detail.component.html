<main id="main">
  <app-title
    title="reportes"
    section="graficas"
    [subSection]="'detalles de postgrado'"
  ></app-title>

  <section class="section">
    @if (graphicsService.graphicsLoading()) { <app-spinner /> }@else {

    <bar-chart
      [keysArray]="keysArray()"
      [valuesArray]="valuesArray()"
      [title]="'detalles de postgrado de egresados'"
      [titleY]="'cantidad de egresados' | titlecase"
    />
    }
  </section>
</main>
