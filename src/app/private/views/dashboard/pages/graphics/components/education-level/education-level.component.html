<main id="main">
  <app-title
    title="reportes"
    section="graficas"
    icon="bi bi-bar-chart-steps"
    [subSection]="'nivel de estudios'"
  ></app-title>

  <section class="section">
    @if (graphicsService.graphicsLoading()) { <app-spinner /> }@else {

    <pie-chart
      [keysArray]="keysArray()!"
      [valuesArray]="valuesArray()!"
      [title]="'nivel educativo de egresados'"
      [colors]="colors"
    />}
  </section>
</main>
