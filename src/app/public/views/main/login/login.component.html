<section
  class="section min-vh-100 d-flex flex-column align-items-center justify-content-center py-4"
>
  <div class="container-fluid">
    <div class="row d-flex justify-content-center">
      <div class="col-lg-4 col-md-6">
        <div class="card mb-3">
          <div class="card-body">
            <div class="card-title d-flex flex-column align-items-center">
              <a [routerLink]="['/']" class="my-logo">
                <img
                  class="img-fluid"
                  src="assets/logo.png"
                  alt="Graduados Tomasinos"
                />
              </a>
              <div class="d-flex">
                <a class="me-1" [routerLink]="['../']"
                  ><i class="bi bi-arrow-left"></i
                ></a>
                <h3 class="ms-1">Inicia sesión con tu cuenta</h3>
              </div>
            </div>

            <form class="row g-3" [formGroup]="myForm" (ngSubmit)="login()">
              <div class="col-12">
                <label class="form-label">Usuario</label>
                <div class="input-group">
                  <span class="input-group-text">
                    <i class="bi bi-person"></i
                  ></span>
                  <input
                    type="text"
                    class="form-control"
                    formControlName="username"
                  />
                </div>
              </div>

              <div class="col-12">
                <label class="form-label">Contraseña</label>

                <div class="input-group">
                  <span class="input-group-text"
                    ><i class="bi bi-key"></i
                  ></span>
                  <input
                    [type]="passwordVisible() ? 'text' : 'password'"
                    class="form-control"
                    formControlName="password"
                  />
                  <button
                    type="button"
                    class="btn btn-outline-secondary"
                    (click)="tooglePasswordVisibility()"
                  >
                    <i
                      [className]="
                        passwordVisible() ? 'bi bi-eye-slash' : 'bi bi-eye'
                      "
                    >
                    </i>
                  </button>
                </div>
              </div>
              <div class="col-12">
                <button class="btn w-100 mb-3 mt-4" type="submit">
                  Iniciar Sesión
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
